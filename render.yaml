services:
  - type: web
    name: clausepay-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: demo orders are kept in memory, so every request must reach the same process.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 "clausepay.webapp:create_app()"
    healthCheckPath: /health
    envVars:
      # Set these in the Render dashboard (sync: false keeps values out of git).
      # Never add passwords here: the app only needs emails and the REST credentials.
      - key: client_id
        sync: false
      - key: client_secret
        sync: false
      - key: u_1_email
        sync: false
      - key: u_2_email
        sync: false
      - key: buyer_email
        sync: false
      - key: business_email
        sync: false
      # Key for the Claude API (the contract chat). Never commit it.
      - key: claude_key
        sync: false
      # The Webhook ID PayPal shows after you register https://<your-app>.onrender.com/webhooks/paypal
      - key: paypal_webhook_id
        sync: false
