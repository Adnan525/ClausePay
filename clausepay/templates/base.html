<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClausePay (demo)</title>
  <style>
    :root { color-scheme: light dark; --edge: #8885; --warn-bg: #fff3cd; --warn-fg: #664d03; --accent: #0b5cd5; --ok: #16794c; --bad: #b42318; }
    body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; }
    .demo { background: var(--warn-bg); color: var(--warn-fg); padding: .75rem 1rem; text-align: center; font-weight: 600; }
    main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem; }
    h1 { margin: 0 0 .25rem; }
    p.lead { margin-top: 0; opacity: .8; }
    nav { display: flex; gap: .5rem; margin: 1rem 0 1.5rem; border-bottom: 1px solid var(--edge); }
    nav a { padding: .5rem 1rem; text-decoration: none; color: inherit; border-bottom: 3px solid transparent; }
    nav a.active { border-bottom-color: var(--accent); font-weight: 600; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .card { border: 1px solid var(--edge); border-radius: .75rem; padding: 1rem; }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .role { opacity: .75; font-size: .9rem; margin: .25rem 0 .75rem; }
    .email { font-family: ui-monospace, monospace; font-size: .85rem; word-break: break-all; }
    .missing { opacity: .6; font-style: italic; }
    button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid var(--edge); cursor: pointer; background: var(--accent); color: white; }
    button.secondary { background: transparent; color: inherit; }
    button:disabled { opacity: .5; cursor: default; }
    input { font: inherit; padding: .5rem; border-radius: .5rem; border: 1px solid var(--edge); width: 8rem; }
  </style>
</head>
<body>
  <div class="demo">DEMO ONLY &mdash; PayPal sandbox. No real money moves and nothing here is financial advice.</div>
  <main>
    <h1>ClausePay</h1>
    <p class="lead">Routes sales between partners and handles refunds, according to a plain-English contract.</p>
    <nav>
      <a href="/" class="{{ 'active' if active == 'accounts' }}">Accounts</a>
      <a href="/order" class="{{ 'active' if active == 'order' }}">Order</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
